<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opencode Chat</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="sidebar">
    <button id="newchat">+ New chat</button>
    <h2>History</h2>
    <div id="sessions"></div>
  </div>
  <div id="main">
    <header>
      <button id="toggle" title="Toggle sidebar">☰</button>
      <h1>Opencode Chat</h1>
      <span id="status">loading models…</span>
      <label>🤖 <select id="modelA"></select></label>
      <label>🤖 <select id="modelB"></select></label>
      <button id="battle" title="Bot battle mode: the two bots talk to each other">⚔ Battle</button>
    </header>
    <div id="avatarbox">
      <div class="avatar-unit">
        <svg class="avatar" id="avatarA" data-state="idle" viewBox="0 0 110 110" aria-label="Bot A avatar">
          <line x1="55" y1="14" x2="55" y2="26" stroke="#3a3b44" stroke-width="3" />
          <circle class="antenna-tip" cx="55" cy="10" r="5" />
          <rect class="head" x="15" y="26" width="80" height="66" rx="20" />
          <rect class="screen" x="25" y="36" width="60" height="46" rx="12" />
          <circle class="eye" cx="42" cy="56" r="5.5" />
          <circle class="eye" cx="68" cy="56" r="5.5" />
          <path class="mouth" d="M44 74 Q55 80 66 74" />
          <circle class="cheek" cx="34" cy="68" r="4.5" />
          <circle class="cheek" cx="76" cy="68" r="4.5" />
        </svg>
        <div class="name" id="nameA">Bot A</div>
        <div class="caption" id="capA"></div>
      </div>
      <div class="avatar-unit">
        <svg class="avatar" id="avatarB" data-state="idle" viewBox="0 0 110 110" aria-label="Bot B avatar">
          <line x1="55" y1="14" x2="55" y2="26" stroke="#3a3b44" stroke-width="3" />
          <circle class="antenna-tip" cx="55" cy="10" r="5" />
          <rect class="head" x="15" y="26" width="80" height="66" rx="20" />
          <rect class="screen" x="25" y="36" width="60" height="46" rx="12" />
          <circle class="eye" cx="42" cy="56" r="5.5" />
          <circle class="eye" cx="68" cy="56" r="5.5" />
          <path class="mouth" d="M44 74 Q55 80 66 74" />
          <circle class="cheek" cx="34" cy="68" r="4.5" />
          <circle class="cheek" cx="76" cy="68" r="4.5" />
        </svg>
        <div class="name" id="nameB">Bot B</div>
        <div class="caption" id="capB"></div>
      </div>
    </div>
    <div id="chat"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
      <button id="stop" style="display:none">Stop</button>
    </div>
  </div>
  <script src="/js/viewer.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
